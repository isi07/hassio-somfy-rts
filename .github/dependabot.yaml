version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # Python dependencies (requirements.txt = image, requirements-test.txt = CI tooling).
  # All pinned exactly; one grouped PR per week, validated by lint, tests, image
  # build and smoke test.
  - package-ecosystem: "pip"
    directory: "/somfy-rts"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      python:
        patterns:
          - "*"

  # Home Assistant base image (FROM in somfy-rts/Dockerfile, dated release tag).
  # A new Python minor version also needs setup-python (build.yaml) and ruff.toml.
  - package-ecosystem: "docker"
    directory: "/somfy-rts"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
