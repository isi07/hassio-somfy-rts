name: Build & Publish Add-on

on:
  push:
    tags:
      - "v*"      # v0.1.0, v0.1.0-beta.1, v1.0.0 ...
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"  # keep in sync with FROM in somfy-rts/Dockerfile

      - name: Install dependencies
        # Runtime deps + pinned test/lint tooling (ruff, yamllint, pytest, ...)
        run: pip install -r somfy-rts/requirements-test.txt

      - name: Run ruff
        run: ruff check somfy-rts/ tools/

      - name: Run tests
        run: |
          cd somfy-rts
          pytest tests/ -v

      - name: Lint YAML
        run: |
          yamllint .github/workflows/build.yaml
          yamllint somfy-rts/config.yaml

      - name: Lint Shell
        run: |
          sudo apt-get install -y shellcheck
          shellcheck somfy-rts/run.sh

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: somfy-rts/Dockerfile

      - name: Validate JSON
        run: |
          python -m json.tool somfy-rts/somfy_rts/device_profiles.json > /dev/null
          echo "JSON valid"

      - name: Validate HA Add-on config
        uses: frenck/action-addon-linter@v2
        with:
          path: "./somfy-rts"

      - name: Lint GitHub Actions workflow
        run: |
          script="https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash"
          bash <(curl -s "$script") 1.7.12
          ./actionlint .github/workflows/build.yaml

  build:
    name: "Build ${{ matrix.arch }}"
    needs: lint
    runs-on: ubuntu-latest
    # Runs on every PR / push so action updates (QEMU, Buildx, build-push) are
    # exercised before a release. Login and push only happen for tags v*.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, aarch64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from config.yaml
        id: version
        run: |
          echo "version=$(grep '^version:' somfy-rts/config.yaml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (push only for tags)
        uses: docker/build-push-action@v7
        with:
          context: somfy-rts
          file: somfy-rts/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # Non-tag runs load the image into the local daemon for the smoke test
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/isi07/somfy-rts:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=${{ steps.version.outputs.date }}
            BUILD_REF=${{ github.sha }}

      - name: Smoke test image (Python version + imports)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          IMAGE: ghcr.io/isi07/somfy-rts:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          PLATFORM: linux/${{ matrix.arch }}
          CHECK: >-
            import platform, sys, aiohttp, paho.mqtt, serial, somfy_rts.main;
            print(platform.machine(), sys.executable, sys.version);
            print("aiohttp", aiohttp.__version__)
        run: |
          docker run --rm --platform "$PLATFORM" --entrypoint python3 "$IMAGE" -c "$CHECK"
          docker inspect --format '{{ json .Config.Labels }}' "$IMAGE"

  manifest:
    name: Create multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from config.yaml
        id: version
        run: |
          echo "version=$(grep '^version:' somfy-rts/config.yaml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/isi07/somfy-rts:${{ steps.version.outputs.version }} \
            -t ghcr.io/isi07/somfy-rts:latest \
            ghcr.io/isi07/somfy-rts:${{ steps.version.outputs.version }}-amd64 \
            ghcr.io/isi07/somfy-rts:${{ steps.version.outputs.version }}-aarch64

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: manifest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.cliff.outputs.content }}
          # Pre-release for any tag containing a hyphen (e.g. v0.1.0-beta.1)
          prerelease: ${{ contains(github.ref, '-') }}
