---
configuration:
  mqtt_host:
    name: MQTT broker
    description: >-
      Hostname or IP of the MQTT broker. For the Mosquitto app: core-mosquitto
  mqtt_port:
    name: MQTT port
    description: >-
      Port of the MQTT broker. Usual: 1883 = unencrypted (MQTT TLS off);
      8883 = encrypted with TLS — the same for public (e.g. Let's Encrypt) and
      self-signed certificates. Some brokers use other ports; the broker's
      configuration is authoritative.
  mqtt_user:
    name: MQTT user
    description: User name for the MQTT broker (empty = no authentication).
  mqtt_password:
    name: MQTT password
    description: Password for the MQTT broker.
  mqtt_tls:
    name: MQTT over TLS
    description: >-
      Encrypt the connection to the broker (TLS). The port is then usually 8883.
  mqtt_tls_verify:
    name: Verify TLS certificate
    description: >-
      Verify the broker certificate. Keep it on for public certificates
      (e.g. Let's Encrypt). Turn it off for self-signed certificates (a custom
      CA file is not supported) — the connection is then encrypted but not
      protected against an impostor broker.
  usb_port:
    name: NanoCUL USB port
    description: >-
      Device path of the NanoCUL stick, e.g. /dev/ttyACM0 or /dev/ttyUSB0
      (see App → Info → Hardware).
  baudrate:
    name: Baud rate
    description: Serial baud rate of the NanoCUL (culfw default 9600).
  address_prefix:
    name: Address prefix
    description: >-
      4 hex characters used for the addresses of newly paired devices
      (e.g. A000 → A00001). Locked after the first device has been paired.
  log_level:
    name: Log level
    description: Verbosity of the app log.
  log_format:
    name: Frame log format
    description: Log transmitted RTS frames as text or as JSON.
  simulation_mode:
    name: Simulation mode
    description: >-
      Test without a NanoCUL — commands are only logged, not transmitted.
      Note: rolling codes are still incremented.
  file_logging:
    name: Frame log file
    description: >-
      Additionally write transmitted RTS frames to /share/somfy_rts/rts_frames.log.
  timezone:
    name: Time zone
    description: Time zone for log timestamps, e.g. Europe/Berlin.
  debug_mode:
    name: Debug mode
    description: >-
      Advanced controls in the Web UI: send any RTS command with a freely chosen
      repeat count. For troubleshooting only.
network:
  8099/tcp: >-
    Direct access to the Web UI and REST API without authentication — disabled by
    default. Not needed for the sidebar. Only open it on a trusted network.
